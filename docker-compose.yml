# Local development stack: frontend + backend + MySQL + Redis.
#
# Usage:
#   1. cp backend/.env.example backend/.env   (if you don't already have one)
#      and fill in JWT_SECRET / JWT_REFRESH_SECRET / GEMINI_API_KEY
#   2. docker-compose up --build
#   3. Frontend: http://localhost:8080   Backend (direct): http://localhost:5001
#
# MYSQL_ALLOW_EMPTY_PASSWORD matches this project's existing local-dev
# convention (root, no password, per README/backend/.env.example) — dev only,
# never do this for a real deployment.

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: hms_db
    ports:
      - "3306:3306" # optional — lets a local GUI client (TablePlus etc.) connect directly
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379" # optional — lets redis-cli connect directly for debugging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Reuses your existing backend/.env for secrets (JWT_SECRET,
    # JWT_REFRESH_SECRET, GEMINI_API_KEY); the entries below override just
    # the values that differ inside the compose network.
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: hms_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Applies schema.sql + migrations (idempotent) before starting the API,
    # so a fresh `docker-compose up` gets a working schema automatically.
    command: sh -c "node database/migrate.js && node server.js"
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5001:5000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysql_data:
  backend_uploads:
