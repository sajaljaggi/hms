server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin reverse proxy to the backend — the browser only ever talks
    # to this nginx server, so auth cookies stay same-site and CORS never
    # comes into play (mirrors the Vite dev-server proxy used locally).
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded prescription/profile-image files, served by the backend.
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
    }

    # Client-side routing (React Router) — fall back to index.html for any
    # path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
