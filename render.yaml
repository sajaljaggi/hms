# Render Blueprint — https://render.com/docs/blueprint-spec
# Import via Render dashboard: New > Blueprint > select this repo.
# Values left blank (sync: false) are prompted for at import time — never
# commit real secrets here.
#
# MySQL is NOT included: Render doesn't offer managed MySQL. This project
# uses Aiven's free MySQL tier (aiven.io/free-mysql-database — no card,
# real MySQL with full foreign-key support). Create a service there, then
# paste its host/port/user/password/database into DB_HOST / DB_PORT /
# DB_USER / DB_PASSWORD / DB_NAME below, with DB_SSL=true.
#
# Aiven's free tier auto-powers-off after ~24h of no database query
# activity — see .github/workflows/keep-alive.yml, which pings
# /api/health (a real DB query, not just a liveness check) every 12h to
# prevent that. Set that workflow's BACKEND_HEALTH_URL repo variable to
# this service's URL + /api/health once it's deployed.

services:
  - type: web
    name: hms-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    # No dockerCommand override needed — backend/Dockerfile's CMD (start.sh)
    # already applies schema.sql + migrations before starting the API. This
    # also sidesteps Render's free plan not having Shell access for a
    # one-off migration command, and avoids relying on how Render parses a
    # dockerCommand string (it does not appear to invoke a shell the way a
    # plain `sh -c "a && b"` string implies — learned this the hard way).
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_CA_CERT
        sync: false # paste the PEM text from Aiven's "CA certificate" field — required to verify the TLS chain, not just encrypt it
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MIN
        value: 15
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: CORS_ORIGIN
        sync: false # set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_HOST
        fromService:
          type: redis
          name: hms-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: hms-redis
          property: port

  - type: redis
    name: hms-redis
    plan: free
    ipAllowList: [] # only reachable from other services in this Render account
